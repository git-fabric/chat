  <rect x="196" y="146" width="45" height="24" rx="12" fill="#a371f7" fill-opacity=".12" stroke="#a371f7" stroke-opacity=".7"/><text x="218" y="162" text-anchor="middle" font-size="12" fill="#a371f7">MCP</text><rect x="251" y="146" width="83" height="24" rx="12" fill="#58a6ff" fill-opacity=".12" stroke="#58a6ff" stroke-opacity=".7"/><text x="292" y="162" text-anchor="middle" font-size="12" fill="#58a6ff">Sessions</text><rect x="344" y="146" width="68" height="24" rx="12" fill="#3fb950" fill-opacity=".12" stroke="#3fb950" stroke-opacity=".7"/><text x="377" y="162" text-anchor="middle" font-size="12" fill="#3fb950">Search</text><rect x="421" y="146" width="75" height="24" rx="12" fill="#e3b341" fill-opacity=".12" stroke="#e3b341" stroke-opacity=".7"/><text x="459" y="162" text-anchor="middle" font-size="12" fill="#e3b341">Threads</text>
